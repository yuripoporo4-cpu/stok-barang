<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23304a">
<title>Stok Barang</title>
<style>
:root{--bg:#f1f3f7;--card:#fff;--ink:#1a2233;--mute:#6b778c;--line:#dde2ea;--main:#23304a;--ok:#2f7d57;--warn:#c4532d;--accent:#3d6ff0}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#192131;--ink:#e8edf6;--mute:#92a0b8;--line:#27324a;--main:#0d1220;--ok:#5fc08f;--warn:#ef8a66;--accent:#7b9bff}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);max-width:480px;margin:0 auto;display:flex;flex-direction:column}
header{background:var(--main);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 16px}
header h1{font-size:20px}
header p{font-size:13px;opacity:.8;margin-top:2px}
main{flex:1;overflow-y:auto;padding:14px 14px 90px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);border-color:transparent}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:16px}
.btn:disabled{opacity:.6}
.item{display:flex;gap:12px;align-items:center}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--bg);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--mute);font-size:22px}
.info{flex:1;min-width:0}
.info b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{font-size:14px;color:var(--mute)}
.qty strong{font-size:20px;color:var(--ok)}
.low .qty strong{color:var(--warn)}
.tag{display:inline-block;font-size:12px;color:var(--warn);margin-left:6px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;padding:10px;border-radius:9px;border:1.5px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14px}
.acts .in{border-color:var(--ok);color:var(--ok)}.acts .out{border-color:var(--warn);color:var(--warn)}
.acts .x{flex:none;width:44px;color:var(--mute)}
.alert{background:var(--warn);color:#fff;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.empty{color:var(--mute);font-size:14px;padding:8px 2px}
.log{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.log:first-of-type{border-top:0}.log small{color:var(--mute);display:block;font-size:12px}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--warn);font-weight:700}
.msg{font-size:13px;margin-top:10px;min-height:18px;color:var(--mute)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:16px 0}
nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
</style>
</head>
<body>
<header><h1>Stok Barang</h1><p id="sum"></p></header>
<main>
  <section id="v-stok" class="on">
    <div id="alert"></div>
    <input type="search" id="cari" placeholder="Cari barang…" style="margin-bottom:12px">
    <div id="list"></div>
  </section>
  <section id="v-tambah">
    <div class="card">
      <label for="nama" style="margin-top:0">Nama barang</label>
      <input id="nama" placeholder="Contoh: Beras 5 kg">
      <div class="two">
        <div><label for="jml">Stok awal</label><input id="jml" type="number" inputmode="numeric" min="0" value="0"></div>
        <div><label for="min">Batas minimum</label><input id="min" type="number" inputmode="numeric" min="0" value="5"></div>
      </div>
      <label for="unit">Satuan</label>
      <select id="unit"><option>pcs</option><option>kg</option><option>liter</option><option>box</option><option>pak</option></select>
      <label for="foto">Foto (opsional)</label>
      <input id="foto" type="file" accept="image/*">
      <button class="btn" id="simpan">Simpan barang</button>
      <div class="msg" id="msg"></div>
    </div>
  </section>
  <section id="v-riwayat">
    <div class="card"><div id="log"></div></div>
  </section>
</main>
<nav>
  <button class="on" data-v="stok">Stok</button>
  <button data-v="tambah">Tambah</button>
  <button data-v="riwayat">Riwayat</button>
</nav>
<script>
const KEY="stok-barang-v1";
let S={items:[],log:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Data tidak bisa disimpan di browser ini.")}}
function render(){
  const q=$("cari").value.toLowerCase();
  const low=S.items.filter(i=>i.qty<=i.min);
  $("sum").textContent=S.items.length+" jenis barang · "+low.length+" stok menipis";
  $("alert").innerHTML=low.length?`<div class="alert">Stok menipis: ${low.map(i=>esc(i.name)).join(", ")}</div>`:"";
  const rows=S.items.filter(i=>i.name.toLowerCase().includes(q));
  $("list").innerHTML=rows.length?rows.map(i=>`<div class="card ${i.qty<=i.min?"low":""}">
    <div class="item">${i.photo?`<img class="thumb" src="${esc(i.photo)}" alt="" loading="lazy">`:`<div class="thumb">📦</div>`}
    <div class="info"><b>${esc(i.name)}</b><div class="qty"><strong>${i.qty}</strong> ${esc(i.unit)}${i.qty<=i.min?'<span class="tag">menipis</span>':""}</div></div></div>
    <div class="acts"><button class="in" data-a="in" data-id="${i.id}">+ Masuk</button><button class="out" data-a="out" data-id="${i.id}">− Keluar</button><button class="x" data-a="del" data-id="${i.id}" aria-label="Hapus">×</button></div></div>`).join(""):'<div class="empty">'+(S.items.length?"Tidak ada yang cocok.":"Belum ada barang. Buka tab Tambah untuk mulai.")+'</div>';
  $("log").innerHTML=S.log.length?S.log.slice().reverse().map(l=>`<div class="log"><div>${esc(l.name)}<small>${new Date(l.t).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} · sisa ${l.qty}</small></div><div class="${l.d>0?"pos":"neg"}">${l.d>0?"+":""}${l.d}</div></div>`).join(""):'<div class="empty">Belum ada pergerakan stok.</div>';
}
function addLog(item,d){S.log.push({t:Date.now(),name:item.name,d,qty:item.qty});S.log=S.log.slice(-100)}
$("list").addEventListener("click",e=>{
  const a=e.target.dataset.a,id=e.target.dataset.id;if(!a)return;
  const it=S.items.find(i=>String(i.id)===id);if(!it)return;
  if(a==="del"){if(confirm('Hapus "'+it.name+'"?')){S.items=S.items.filter(i=>i!==it);save();render()}return}
  const n=parseInt(prompt((a==="in"?"Jumlah masuk":"Jumlah keluar")+" ("+it.unit+")?","1"),10);
  if(!n||n<0)return;
  if(a==="out"&&n>it.qty){alert("Stok tidak cukup. Sisa "+it.qty+".");return}
  const d=a==="in"?n:-n;it.qty+=d;addLog(it,d);save();render();
});
$("cari").addEventListener("input",render);
// Kecilkan foto dulu supaya hemat kuota dan cepat diunggah
function shrink(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=800,r=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*r;c.height=img.height*r;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>b?res(b):rej(new Error("Gagal memproses foto")),"image/jpeg",.75)};
  img.onerror=()=>rej(new Error("File bukan gambar"));img.src=u})}
async function upload(file){
  const blob=await shrink(file);
  const r=await fetch("/api/upload?name="+Date.now()+".jpg",{method:"POST",headers:{"Content-Type":"image/jpeg"},body:blob});
  const j=await r.json();if(!r.ok)throw new Error(j.error||"Upload gagal");return j.url;
}
$("simpan").addEventListener("click",async()=>{
  const name=$("nama").value.trim();
  if(!name){$("msg").textContent="Isi nama barang dulu.";return}
  const btn=$("simpan");btn.disabled=true;$("msg").textContent="";
  let photo="";const f=$("foto").files[0];
  if(f){$("msg").textContent="Mengunggah foto…";
    try{photo=await upload(f)}catch(e){$("msg").textContent="Foto tidak terunggah ("+e.message+"). Barang tetap disimpan tanpa foto."}}
  const it={id:Date.now(),name,qty:Math.max(0,parseInt($("jml").value,10)||0),min:Math.max(0,parseInt($("min").value,10)||0),unit:$("unit").value,photo};
  S.items.unshift(it);if(it.qty)addLog(it,it.qty);save();
  $("nama").value="";$("jml").value=0;$("foto").value="";btn.disabled=false;render();
  if(!$("msg").textContent||!$("msg").textContent.includes("tidak"))$("msg").textContent="Tersimpan.";
});
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav button,section").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");$("v-"+b.dataset.v).classList.add("on");
}));
load();render();
</script>
</body>
</html>
